schema_version: 2
name: NVIDIA NIM
slug: nvidia-nim
vendor: NVIDIA
category: model-api
product_url: https://build.nvidia.com/
pricing_url: https://docs.api.nvidia.com/nim/re/docs/run-anywhere
repo_url: null
status:
  availability: active
  notes: Free hosted endpoint availability is catalog/model-specific and changes over
    time.
platforms:
- api
- self-hosted
- cloud
- web
authentication:
  account_required: 'yes'
  credit_card_required: unknown
  notes: NVIDIA API key creation signs the user into or enrolls the user in the NVIDIA
    Developer Program; no reviewed official source stated a universal credit-card
    requirement.
free_tier:
  available: true
  types:
  - dynamic_rate_limit
  plan_name: NVIDIA Developer Program NIM access
  quantity_published: false
  quota_pools: []
  after_exhaustion: NVIDIA does not publish a universal hosted free quota or reset;
    free hosted API access is for prototyping and model availability is catalog-specific.
    Production use requires an NVIDIA AI Enterprise license.
  rollover: unknown
models:
  available: []
  restrictions:
  - The build.nvidia.com catalog labels Free Endpoint availability per model and changes
    over time; do not treat examples or catalog counts as a complete model list or
    quota.
project_limits: []
deployment:
- Hosted NIM API endpoints are available through build.nvidia.com for prototyping
  and are hosted by NVIDIA on DGX Cloud.
- The main LLM API endpoint is https://integrate.api.nvidia.com with POST /v1/chat/completions;
  build.nvidia.com examples use https://integrate.api.nvidia.com/v1 as the OpenAI
  client base URL.
- Eligible NIM microservices can be downloaded and self-hosted on the user's own infrastructure
  under NVIDIA Developer Program terms.
runtime_limits:
- Self-hosted Developer Program NIM use is licensed for research, application development,
  and experimentation on up to 16 GPUs.
storage_limits: []
concurrency_limits: []
eligibility:
- NVIDIA Developer Program membership is required for free hosted endpoint prototyping
  and Developer Program NIM access.
- NVIDIA AI Enterprise is separate from Developer Program access and is required for
  production use according to NVIDIA current docs.
regions: []
trial:
  available: false
  duration_days: null
  allowance: null
  recurring: false
  notes: NVIDIA AI Enterprise has a separate 90-day evaluation path; this record tracks
    the normal Developer Program hosted API/self-hosted development access, not that
    trial.
notes:
- build.nvidia.com describes NIM as free serverless APIs for development and provides
  per-model Generate API Key/code snippets.
- Do not treat API calls in the last 30 days or catalog model counts as a user quota.
- Current Free Endpoint examples verified on 2026-09-09 include deepseek-ai/deepseek-v4-pro-0813,
  poolside/laguna-xs-2.1, and nvidia/nemotron-3.5-lightning-30b-a3b; availability
  is dynamic.
