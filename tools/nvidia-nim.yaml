  account_required: 'yes'
  credit_card_required: unknown
  notes: NVIDIA API key creation signs the user into or enrolls the user in the NVIDIA Developer Program;
    no reviewed official source stated a universal credit-card requirement.
free_tier:
  available: true
  types:
  - dynamic_rate_limit
  plan_name: NVIDIA Developer Program NIM access
  quantity_published: false
  quota_pools: []
  after_exhaustion: NVIDIA does not publish a universal hosted free quota or reset; free hosted API access
    is for prototyping and model availability is catalog-specific. Production use requires an NVIDIA AI
    Enterprise license.
  rollover: unknown
models:
  available: []
  restrictions:
  - The build.nvidia.com catalog labels Free Endpoint availability per model and changes over time; do
    not treat examples or catalog counts as a complete model list or quota.
project_limits: []
deployment:
- Hosted NIM API endpoints are available through build.nvidia.com for prototyping and are hosted by NVIDIA
  on DGX Cloud.
- The main LLM API endpoint is https://integrate.api.nvidia.com with POST /v1/chat/completions; build.nvidia.com
  examples use https://integrate.api.nvidia.com/v1 as the OpenAI client base URL.
- Eligible NIM microservices can be downloaded and self-hosted on the user's own infrastructure under
  NVIDIA Developer Program terms.
runtime_limits:
- Self-hosted Developer Program NIM use is licensed for research, application development, and experimentation
  on up to 16 GPUs.
storage_limits: []
concurrency_limits: []
eligibility:
- NVIDIA Developer Program membership is required for free hosted endpoint prototyping and Developer Program
  NIM access.
- NVIDIA AI Enterprise is separate from Developer Program access and is required for production use according
  to NVIDIA current docs.
regions: []
trial:
  available: false
  duration_days: null
  allowance: null
  recurring: false
  notes: NVIDIA AI Enterprise has a separate 90-day evaluation path; this record tracks the normal Developer
    Program hosted API/self-hosted development access, not that trial.
notes:
- build.nvidia.com describes NVIDIA-hosted API endpoints for application prototyping and per-model API
  keys; access requires NVIDIA Developer Program membership.
- As of 2026-11-10, the live catalog displayed 44 Free Endpoint models. Examples visible in the catalog
  included moonshotai/kimi-k3.1-pro, deepseek-ai/deepseek-v4.1-flash, and nvidia/nemotron-3.5-lightning-30b-a3b;
  the count and model list are dynamic and are not a user quota.
- NVIDIA Developer Program access includes free hosted API prototyping and downloadable NIM microservices
  for research, development, and experimentation on up to 16 GPUs. Production requires an NVIDIA AI Enterprise
  license; its separate 90-day evaluation is not this record’s free tier.
- Do not treat API calls in the last 30 days or catalog model counts as a user quota.
