- AI Free requires an active JetBrains IDE license and IDE version 2025.1 or later.
- AI Free is unavailable in IntelliJ IDEA Community Edition, PyCharm Community Edition, and Android Studio.
- JetBrains AI is unavailable in China; external or local models remain available.
