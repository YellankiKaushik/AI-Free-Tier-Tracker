name: Report a quota change
description: Report a changed free allowance, reset, trial, or availability status
title: "[Quota change]: "
labels: ["quota-change"]
body:
  - type: input
    id: tool
    attributes:
      label: Tool
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Official source URL
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: What changed?
      description: State the exact field, old value, new value, unit, reset behavior, and whether the new claim is exact or undisclosed.
    validations:
      required: true
  - type: input
    id: checked
    attributes:
      label: Date verified (YYYY-MM-DD)
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence summary
      description: Paraphrase the official source. Do not paste large page excerpts.
    validations:
      required: true
