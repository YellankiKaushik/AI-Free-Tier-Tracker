name: Add a new tool
description: Propose a new AI coding tool or app builder
title: "[Tool]: "
labels: ["new-tool"]
body:
  - type: input
    id: name
    attributes:
      label: Canonical product name
    validations:
      required: true
  - type: input
    id: product_url
    attributes:
      label: Official product URL
    validations:
      required: true
  - type: input
    id: source_url
    attributes:
      label: Official pricing/docs source URL
    validations:
      required: true
  - type: textarea
    id: allowance
    attributes:
      label: Free allowance and reset behavior
      description: Do not guess; write "undisclosed" if the vendor does not publish it.
    validations:
      required: true
  - type: input
    id: checked
    attributes:
      label: Date checked (YYYY-MM-DD)
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence summary
      description: Paraphrase the official source. Do not paste large page excerpts.
    validations:
      required: true
