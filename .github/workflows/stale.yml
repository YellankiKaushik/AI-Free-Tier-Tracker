name: Check stale verification dates

on:
  workflow_dispatch:

permissions: {}

jobs:
  stale:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python scripts/check_stale_entries.py --warn-after 30 --fail-after 60
