name: Check source health

on:
  schedule:
    - cron: '41 4 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python scripts/check_links.py --json source-health-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-health-report
          path: source-health-report.json
